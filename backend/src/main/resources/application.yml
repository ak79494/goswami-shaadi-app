server:
  port: 8080
  address: 0.0.0.0
  

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goswami_shaadi?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  mail:
    host: smtp.gmail.com
    port: 587
    # Never commit real credentials. Set MAIL_USERNAME / MAIL_PASSWORD (a Gmail app password)
    # as environment variables, or put them in the gitignored application-local.yml.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-production-secret}
    expiry-ms: ${JWT_EXPIRY_MS:2592000000}

  upload-dir: ${UPLOAD_DIR:uploads}

  # Shown on the app's About, Help and Astro screens.
  company:
    name: Goswami Jodi
    founder: Arun Goswami
    phone: ${SUPPORT_PHONE:7903508584}
    whatsapp: ${SUPPORT_WHATSAPP:7903508584}
    email: ${SUPPORT_EMAIL:support@goswamijodi.com}
    astro-whatsapp: ${ASTRO_WHATSAPP:7903508584}

  # Where members pay for premium. Bank fields are optional; set them in application-local.yml.
  payment:
    upi-id: ${PAYMENT_UPI_ID:goswamiarun263@okicici}
    payee-name: ${PAYMENT_PAYEE_NAME:Goswami Jodi}
    bank-name: ${PAYMENT_BANK_NAME:}
    account-name: ${PAYMENT_ACCOUNT_NAME:}
    account-number: ${PAYMENT_ACCOUNT_NUMBER:}
    ifsc: ${PAYMENT_IFSC:}

  # Notifications while the app is closed. Off until this points at the Firebase service account key.
  push:
    service-account-file: ${FIREBASE_SERVICE_ACCOUNT_FILE:}

  # In-app voice calls (WebRTC). Calls between two mobile-data connections may need a TURN relay:
  # set turn-urls / turn-username / turn-credential (e.g. from a free metered.ca account).
  calls:
    stun-urls: ${CALL_STUN_URLS:stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
    turn-urls: ${CALL_TURN_URLS:}
    turn-username: ${CALL_TURN_USERNAME:}
    turn-credential: ${CALL_TURN_CREDENTIAL:}

logging:
  level:
    org.springframework.security: INFO
    
astro:
  whatsapp:
    graph-api-url: ${ASTRO_WHATSAPP_GRAPH_API_URL:}
    access-token: ${ASTRO_WHATSAPP_ACCESS_TOKEN:}