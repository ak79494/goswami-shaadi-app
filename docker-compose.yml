services:
  mysql:
    image: mysql:8.4
    container_name: goswami-shaadi-mysql
    environment:
      MYSQL_DATABASE: goswami_shaadi
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Kolkata
    ports:
      # Only reachable from this computer. Use MYSQL_PORT=3307 if another MySQL already runs on 3306.
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - goswami_mysqldata:/var/lib/mysql
    restart: unless-stopped

volumes:
  goswami_mysqldata:
