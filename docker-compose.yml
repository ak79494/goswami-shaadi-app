services:
  postgres:
    image: postgres:16
    container_name: goswami-shaadi-postgres
    environment:
      POSTGRES_DB: goswami_shaadi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - goswami_pgdata:/var/lib/postgresql/data

volumes:
  goswami_pgdata:
